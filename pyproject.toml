[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokagent"
version = "0.1.0"
description = "Self-hostable Grok companion registry"
authors = [{name = "Grok Agent", email = "dev@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pyyaml==6.0.1",
    "typer==0.12.3",
    "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
